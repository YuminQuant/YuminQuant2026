# DFQ-FactorGCL: local factors, binary main-business I concepts and training-only TRCL.
run_id = "mdl_000031"
alpha_id = "mdl_000031"
data_root = "data"
output_root = "data/models"
data_version = "factorgcl_local_factors_v1"

[dates]
train = [20160101, 20251231]
predict = [20190101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "yearly_end"
train_lookback = "36m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "none"
feature_fill_value = 0.0

[features]
type = "concept_factor_sequence"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
sequence_length = 30
history_transform = "zscore_clip3"
# Auxiliary future features are supervision; shared windows enforce max(11, 10).
supervision_lookahead_days = 10
memory_budget_mb = 384
future_memory_budget_mb = 128

[materialize]
cache_samples = false
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "dfq_factor_gcl"
class = "yq_ml_alpha.models.factor_gcl_model.FactorGCLAlphaModel"
artifact_dir = "data/model_workspace/mdl_000031/artifacts"

[model.params]
concept_root = "data/derived/stock/hist_concepts"
sequence_length = 30
future_look = 10
hidden_size = 128
num_layers = 2
num_factor = 48
gamma = 1.0
tau = 0.25
negative_slope = 0.01
epochs = 200
patience = 20
average_epochs = 5
dates_per_epoch = 100
# GRU stock chunks; hypergraphs and contrastive negative pools remain whole-date.
batch_size = 3000
contrastive_chunk_size = 512
gradient_checkpointing = true
lr = 0.00009
weight_decay = 0.0
min_delta = 0.00000001
seed = 42
device = "cuda"
