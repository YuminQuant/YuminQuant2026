# Huatai baseline adapted to the local factor library; see docs/HUATAI_BASELINES.md.
# Regress untransformed 10-day VWAP returns; feature preprocessing does not alter labels.
run_id = "mdl_000013"
alpha_id = "mdl_000013"
data_root = "data"
output_root = "data/models"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "mad5_zscore_features"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/mdl_000013/cache"
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "random_forest"
class = "yq_ml_alpha.models.tree_model.RandomForestAlphaModel"
artifact_dir = "data/model_workspace/mdl_000013/rolling60m_5d_vwap10d/artifacts"

[model.params]
n_estimators = 500
max_features = "sqrt"
min_samples_split = 50
min_samples_leaf = 10
n_jobs = 8
bootstrap = true
random_state = 42
