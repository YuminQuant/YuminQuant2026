run_id = "mdl_000002"
alpha_id = "mdl_000002"
data_root = "data"
output_root = "data/models"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "rank_gauss"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/mdl_000002/cache"
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = false
write_loss_history = false
write_model_info = true
write_window_summary = true

[model]
name = "lasso"
class = "yq_ml_alpha.models.regularized_linear_model.LassoAlphaModel"
artifact_dir = "data/model_workspace/mdl_000002/rolling60m_5d_vwap10d/artifacts"

[model.params]
fit_intercept = true

[model.search]
enabled = true
method = "random"
cv = 3
scoring = "neg_mean_squared_error"
n_jobs = -1
random_state = 42

[model.search.space]
alpha = [0.001, 0.01, 0.1, 0.5, 1.0, 3.0, 10.0]
