run_id = "monthly_rf_36"
alpha_id = "ml_alpha_rf"
data_root = "data"
output_root = "data/models"

[dates]
train = [20110101, 20260424]
valid = []
predict = [20110101, 20260424]

[sample]
train_frequency = "monthly_end"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "monthly_end"
train_sample_count = 36

[label]
id = "future_vwap_return_20d"

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "zscore_log_rank"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/monthly_rf_36/cache"
predict_batch_size = 20

[model]
name = "random_forest"
class = "yq_ml_alpha.models.tree_model.RandomForestAlphaModel"
artifact_dir = "data/model_workspace/monthly_rf_36/artifacts"

[model.params]
n_estimators = 200
min_samples_leaf = 50
min_samples_split = 500
max_features = "sqrt"
bootstrap = true
n_jobs = -1
random_state = 42

