run_id = "mdl_100000"
alpha_id = "mdl_100000"
data_root = "data"
calendar_exchange = "SHFE"

[dates]
train = [20200101, 20260930]
predict = [20250101, 20261231]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "semiannual_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_open_return_5m"
root = "data/label/future/minute_1m"
