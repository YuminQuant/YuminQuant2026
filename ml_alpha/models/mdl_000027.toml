# Huatai report 15: factor-time CNN; see docs/HUATAI_CNN.md.
# Report dropout is the DROP probability (80%), not keep probability.
run_id = "mdl_000027"
alpha_id = "mdl_000027"
data_root = "data"
output_root = "data/models"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "mad5_zscore_features"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/mdl_000027/cache"
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "huatai_factor_time_cnn"
class = "yq_ml_alpha.models.cnn_model.CNNAlphaModel"
artifact_dir = "data/model_workspace/mdl_000027/rolling60m_5d_vwap10d/artifacts"

[model.params]
sequence_length = 5
sequence_frequency = "daily"
conv_channels = 10
factor_kernel_size = 5
time_kernel_size = 5
hidden_layers = [100, 70, 40]
activation = "relu"
dropout = 0.8
dense_init_std = 0.1
optimizer = "rmsprop"
epochs = 100
batch_size = 5000
lr = 0.001
weight_decay = 0.0
seed = 42
device = "auto"
patience = 10
