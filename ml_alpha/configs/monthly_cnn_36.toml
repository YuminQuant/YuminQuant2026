run_id = "monthly_cnn_36"
alpha_id = "ml_alpha_cnn"
data_root = "data"
output_root = "data/models"

[dates]
train = [20110101, 20260424]
valid = []
predict = [20110101, 20260424]

[sample]
train_frequency = "monthly_end"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "monthly_end"
train_sample_count = 36
validation_sample_count = 1

[label]
id = "future_vwap_return_20d"

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "zscore_log_rank"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/monthly_cnn_36/cache"
predict_batch_size = 20

[model]
name = "cnn"
class = "yq_ml_alpha.models.cnn_model.CNNAlphaModel"
artifact_dir = "data/model_workspace/monthly_cnn_36/artifacts"

[model.params]
channels = [32, 64]
kernel_size = 3
hidden_size = 64
dropout = 0.10
epochs = 50
batch_size = 8192
lr = 0.001
weight_decay = 0.00001
seed = 42
device = "auto"
patience = 10

