factor_id = "rawbar_restcn"
tags = ["DFZQ", "rawbar", "restcn", "tcn", "ic_loss"]
data_root = "data"

[output]
kind = "factor"
id = "rawbar_restcn"
root = "data/factors"
asset = "stock"
frequency = "daily"
base_root = "data/chn_stock_data/daily/pv"
write_workers = 4

[dates]
train = [20110101, 20251231]
predict = [20160101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "yearly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "none"
feature_fill_value = 0.0

[features]
type = "rawbar"
root = "data/chn_stock_data/daily/pv"
columns = ["open", "high", "low", "close", "vwap", "volume"]

[features.params]
source_frequency = "daily"
bar_size = 1
lookback_sessions = 30
time_series_scale = "none"
strict = true
max_cache_sessions = "auto"

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/rawbar_restcn/cache"
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "rawbar_restcn"
class = "yq_ml_alpha.models.rawbar_restcn_model.RawBarRESTCNAlphaModel"
artifact_dir = "data/model_workspace/rawbar_restcn/artifacts"

[model.params]
sequence_length = 30
panel_clip_sigma = 5.0
input_size = 6
hidden_size = 64
num_layers = 4
dropout = 0.1
epochs = 100
batch_size = 5000
lr = 0.001
weight_decay = 0.0
seed = 42
device = "auto"
patience = 10

residual_blocks = 3
kernel_size = 3
