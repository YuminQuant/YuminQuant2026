factor_id = "multi_bar_gru_daily_15m"
data_root = "data"

[output]
kind = "factor"
id = "multi_bar_gru_daily_15m"
root = "data/factors"
asset = "stock"
frequency = "daily"
base_root = "data/stock_data/daily/pv"
write_workers = 4

[dates]
train = [20110101, 20260424]
valid = []
predict = [20110101, 20260424]

[sample]
train_frequency = "10"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "semiannual_end"
train_lookback = "3y"
validation_ratio = 0.2

[label]
id = "future_vwap_return_5d"

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "zscore"
feature_fill_value = 0.0

[features]
type = "multi_bar_panel"

[features.panels.daily]
root = "data/stock_data/daily/pv"
source_frequency = "daily"
bar_size = 1
lookback_sessions = 40
time_series_scale = "last"
strict = true
max_cache_sessions = "auto"
columns = ["open", "high", "low", "close", "vwap", "volume"]

[features.panels.minute]
root = "data/derived/stock/bar/15m"
source_frequency = "minute_bar"
bar_size = 15
lookback_sessions = 20
time_series_scale = "mean"
strict = true
max_cache_sessions = "auto"
columns = ["open", "high", "low", "close", "vwap", "volume"]

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/multi_bar_gru_daily_15m/cache"
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "multi_bar_gru"
class = "yq_ml_alpha.models.multi_bar_gru_model.MultiBarGRUAlphaModel"
artifact_dir = "data/model_workspace/multi_bar_gru_daily_15m/artifacts"

[model.params]
daily_sequence_length = 40
minute_sequence_length = 320
input_size = 6
hidden_size = 30
num_layers = 1
dropout = 0.0
epochs = 100
batch_size = 5000
lr = 0.001
weight_decay = 0.0
seed = 42
device = "auto"
patience = 10
