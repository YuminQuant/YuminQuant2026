run_id = "mdl_000025"
alpha_id = "mdl_000025"
data_root = "data"
output_root = "data/models"
data_version = "hist_mainbz_i_v1"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "none"
feature_fill_value = 0.0

[features]
type = "hist_factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true
sequence_length = 60
memory_budget_mb = 512

[materialize]
cache_samples = false
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "dfq_hist"
class = "yq_ml_alpha.models.hist_model.HISTAlphaModel"
artifact_dir = "data/model_workspace/mdl_000025/rolling60m_5d_vwap10d/artifacts"

[model.params]
concept_root = "data/derived/stock/hist_concepts"
basic_root = "data/chn_stock_data/daily/basic"
sequence_length = 60
hidden_size = 128
num_layers = 2
top_k = 20
dropout = 0.1
epochs = 100
patience = 20
average_epochs = 5
batch_size = 5000
graph_chunk_size = 512
gradient_checkpointing = true
lr = 0.001
weight_decay = 0.00001
min_delta = 0.00000001
seed = 42
device = "auto"
