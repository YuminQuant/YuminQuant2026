run_id = "monthly_ridge_36"
alpha_id = "ml_alpha_ridge"
data_root = "data"
output_root = "data/models"

[dates]
train = [20110101, 20260424]
valid = []
predict = [20110101, 20260424]

[sample]
train_frequency = "monthly_end"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "monthly_end"
train_sample_count = 36
validation_sample_count = 1

[label]
id = "future_vwap_return_20d"

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "zscore_log_rank"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/monthly_ridge_36/cache"
predict_batch_size = 20

[model]
name = "ridge"
class = "yq_ml_alpha.models.regularized_linear_model.RidgeAlphaModel"
artifact_dir = "data/model_workspace/monthly_ridge_36/artifacts"

[model.params]

[model.params.search]
enabled = true
method = "random"
cv = 3
n_iter = 40
scoring = "neg_mean_squared_error"
n_jobs = -1
random_state = 42

[model.params.search.params]
alpha = [0.0001, 0.0003, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
fit_intercept = [true, false]
solver = ["auto", "svd", "cholesky", "lsqr", "sag", "saga"]
tol = [0.00001, 0.0001, 0.001]
max_iter = [3000, 10000]

[tuning]
enabled = false
method = "none"
