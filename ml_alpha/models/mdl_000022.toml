run_id = "mdl_000022"
alpha_id = "mdl_000022"
data_root = "data"
output_root = "data/models"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "rank_gauss"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/mdl_000022/cache"
predict_batch_size = 20

[model]
name = "xgboost_fixed"
class = "yq_ml_alpha.models.xgb_model.XGBoostAlphaModel"
artifact_dir = "data/model_workspace/mdl_000022/rolling60m_5d_vwap10d/artifacts"

[model.params]
objective = "reg:squarederror"
tree_method = "hist"
device = "cuda"
n_estimators = 600
# Retain the user's earlier preference for a low fixed learning rate.
learning_rate = 0.001
max_depth = 6
min_child_weight = 10.0
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 10.0
gamma = 0.0
random_state = 42
n_jobs = -1
# One fit per window on train + validation, matching 021's final-fit coverage.
# No Optuna, preliminary fit, per-round validation or tree early stopping.
fit_on_validation = true
