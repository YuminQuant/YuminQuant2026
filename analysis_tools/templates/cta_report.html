<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTA 策略报告</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Microsoft YaHei UI", system-ui, sans-serif;
      color: #18272f;
      background: #f1f5f5;
      --ink: #18272f;
      --muted: #4d626c;
      --line: #dce6e7;
      --accent: #08756f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { padding: 36px 0 84px; background: #16323a; color: #fff; }
    .wrap { width: min(1500px, calc(100% - 48px)); margin-inline: auto; }
    h1 { margin: 0 0 10px; font-size: clamp(28px, 4vw, 42px); }
    h2 { margin: 0 0 14px; font-size: 20px; }
    p { margin: 0; }
    #signal { color: #bce1dc; font-size: 16px; }
    main { position: relative; margin-top: -48px; padding-bottom: 32px; }
    section { margin-bottom: 24px; }
    .panel { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 280px)); gap: 15px 22px; }
    label { font-size: 14px; font-weight: 650; }
    select {
      display: block; width: 100%; margin-top: 7px; min-height: 42px; padding: 4px 10px;
      font: inherit; background: #f8fbfb; color: var(--ink);
      border: 1px solid #adc3c5; border-radius: 6px;
    }
    select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #selection { grid-column: 1 / -1; }
    [hidden] { display: none !important; }
    .note { color: var(--muted); font-size: 13px; line-height: 1.6; }
    .scroll { margin-top: 12px; overflow: auto; }
    #products { max-height: 390px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { padding: 9px 12px; white-space: nowrap; text-align: right; border-bottom: 1px solid var(--line); }
    thead th { position: sticky; top: 0; z-index: 1; background: #ecf4f3; color: #233f49; font-weight: 650; }
    th:first-child { position: sticky; left: 0; text-align: left; }
    thead th:first-child { z-index: 2; }
    tbody th { background: #fff; }
    tbody tr:nth-child(even) > * { background: #f6f9fa; }
    tbody tr:hover > * { background: #edf5f4; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 295px), 1fr)); gap: 14px; margin-top: 12px; }
    figure { min-width: 0; margin: 0; padding: 12px; background: #fff; border: 1px solid var(--line); border-radius: 9px; }
    figcaption { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; }
    figcaption strong { font-size: 14px; }
    figcaption output { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
    figcaption .chart-range { flex-basis: 100%; color: var(--muted); font-size: 12px; }
    canvas { display: block; width: 100%; height: 150px; margin-top: 8px; }
    .charts[data-single="true"] canvas { height: clamp(240px, 38vw, 370px); }
    #portfolio-chart { margin-top: 18px; }
    #portfolio-chart canvas { height: clamp(240px, 30vw, 370px); }
    #pnl-bars { margin-top: 18px; }
    #pnl-bars svg { display: block; width: 100%; height: 340px; }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 24px); }
      .panel { padding: 14px; }
      .filters { grid-template-columns: minmax(0, 1fr); }
    }
  </style>
</head>
<body>
  <header><div class="wrap">
    <h1>CTA 策略报告</h1>
    <p id="signal"></p>
  </div></header>
  <main class="wrap">
    <section class="panel filters" aria-label="报告筛选">
      <label>品种范围 <select id="universe"></select></label>
      <label>日期范围 <select id="period"></select></label>
      <label id="start-year-label" hidden>起始年份 <select id="start-year"></select></label>
      <label id="end-year-label" hidden>结束年份 <select id="end-year"></select></label>
      <p id="selection" class="note" aria-live="polite"></p>
    </section>
    <section class="panel" aria-labelledby="portfolio-title">
      <h2 id="portfolio-title">组合绩效</h2>
      <p class="note">组合绩效随品种范围及日期选择更新。金额为人民币，年化按 240 个交易日。累计净盈亏曲线在所选区间起点归零，跨年度按净盈亏金额累加。</p>
      <div id="portfolio" class="scroll"></div>
      <div id="portfolio-chart"></div>
      <div id="pnl-bars"></div>
    </section>
    <section class="panel" aria-labelledby="products-title">
      <h2 id="products-title">品种绩效</h2>
      <p class="note">收益率以初始账户资金加品种累计净盈亏构成的参考权益计算。持仓时间只计实际交易分钟，按平仓交易日先做手数加权平均，再对有平仓的交易日等权平均。</p>
      <div id="products" class="scroll"></div>
    </section>
    <section aria-labelledby="pnl-title">
      <h2 id="pnl-title">品种累计净 PnL</h2>
      <p class="note">各品种在所选区间内首个纳入交易日的前一天标零。单位为人民币，各品种使用独立坐标轴。</p>
      <div id="charts" class="charts"></div>
    </section>
  </main>
  <script type="application/json" id="cta-data">__CTA_DATA__</script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("cta-data").textContent);
    const universe = document.getElementById("universe");
    const period = document.getElementById("period");
    const startYear = document.getElementById("start-year");
    const endYear = document.getElementById("end-year");
    const charts = document.getElementById("charts");
    const products = Object.keys(data.products);
    const dates = data.dates.map(date => Date.parse(date));
    const yearRanges = new Map();
    data.dates.forEach((date, index) => {
      const year = date.slice(0, 4);
      if (!yearRanges.has(year)) yearRanges.set(year, [index, index + 1]);
      yearRanges.get(year)[1] = index + 1;
    });
    const percentColumns = new Set([
      "total_return", "annual_return", "annual_volatility", "max_drawdown",
      "annual_pnl_contribution", "win_rate", "avg_daily_turnover"
    ]);
    const countColumns = new Set(["sessions", "fill_count"]);
    const amount = new Intl.NumberFormat("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    const integer = new Intl.NumberFormat("en-US");
    const compact = new Intl.NumberFormat("en-US", {notation: "compact", maximumFractionDigits: 1});
    const observer = new ResizeObserver(entries => entries.forEach(({target}) => target.redraw()));

    function option(parent, label, value) {
      parent.append(new Option(label, value));
    }

    function addOptions() {
      document.getElementById("signal").textContent = data.signal;
      document.title = data.signal + " · CTA 策略报告";
      option(universe, "全品种", "All");
      const sectors = new Map(products.map(code => {
        const item = data.products[code];
        return [item.sector, item.sector_name];
      }));
      const sectorGroup = document.createElement("optgroup");
      sectorGroup.label = "板块";
      for (const [abbr, name] of sectors) option(sectorGroup, abbr + " · " + name, "sector:" + abbr);
      const productGroup = document.createElement("optgroup");
      productGroup.label = "品种";
      for (const code of products) option(productGroup, productName(code), "product:" + code);
      universe.append(sectorGroup, productGroup);
      option(period, "全日期范围", "All");
      for (const year of yearRanges.keys()) option(period, year + " 年", year);
      option(period, "自定义起止年份", "Custom");
      for (const year of yearRanges.keys()) {
        option(startYear, year + " 年", year);
        option(endYear, year + " 年", year);
      }
      endYear.value = [...yearRanges.keys()].at(-1);
    }

    function productName(code) {
      const name = data.products[code].name;
      return name ? code + " · " + name : code;
    }

    function formatCell(value, column) {
      if (value === null || value === undefined) return "—";
      if (typeof value !== "number" || column === "period") return String(value);
      if (countColumns.has(column)) return integer.format(value);
      if (percentColumns.has(column)) return amount.format(value * 100) + "%";
      return amount.format(value);
    }

    function renderTable(id, columns, rows) {
      const panel = document.getElementById(id);
      if (!rows.length) {
        panel.textContent = "所选范围没有品种日结。";
        return;
      }
      const table = document.createElement("table");
      const head = table.createTHead().insertRow();
      for (const column of columns) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = column;
        head.append(cell);
      }
      const body = table.createTBody();
      for (const values of rows) {
        const row = body.insertRow();
        for (const [index, column] of columns.entries()) {
          const cell = document.createElement(index === 0 ? "th" : "td");
          if (index === 0) cell.scope = "row";
          cell.textContent = formatCell(values[column], column);
          row.append(cell);
        }
      }
      panel.replaceChildren(table);
    }

    function drawChart(canvas, times, values, sessionAxis = false) {
      const {width, height} = canvas.getBoundingClientRect();
      if (!width || !height) return;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(width * ratio);
      canvas.height = Math.round(height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      const left = 50, right = width - 13, top = 8, bottom = height - 24;
      const min = Math.min(0, ...values);
      const max = Math.max(0, ...values);
      const padding = Math.max(1, (max - min) * 0.05);
      const low = min - padding, high = max + padding;
      const span = times.at(-1) - times[0];
      const x = i => left + (sessionAxis ? i / (times.length - 1) : (times[i] - times[0]) / span) * (right - left);
      const y = value => bottom - (value - low) / (high - low) * (bottom - top);
      ctx.font = "11px system-ui, sans-serif";
      ctx.fillStyle = "#4d626c";
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (const value of [low, (low + high) / 2, high]) {
        ctx.fillText(compact.format(value), left - 6, y(value));
      }
      ctx.strokeStyle = "#dce6e7";
      ctx.beginPath();
      ctx.moveTo(left, y(0));
      ctx.lineTo(right, y(0));
      ctx.stroke();
      ctx.strokeStyle = "#08756f";
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      values.forEach((value, i) => i ? ctx.lineTo(x(i), y(value)) : ctx.moveTo(x(i), y(value)));
      ctx.stroke();
      const longRange = new Date(times[0]).getUTCFullYear() !== new Date(times.at(-1)).getUTCFullYear();
      const labels = Math.min(times.length, Math.max(2, Math.min(5, Math.floor((right - left) / 68))));
      ctx.textBaseline = "top";
      for (let tick = 0; tick < labels; tick++) {
        const fraction = tick / (labels - 1);
        const time = sessionAxis ? times[Math.round(fraction * (times.length - 1))] : times[0] + span * fraction;
        const label = new Date(time).toISOString().slice(longRange ? 0 : 5, longRange ? 7 : 10);
        ctx.textAlign = fraction === 0 ? "left" : fraction === 1 ? "right" : "center";
        ctx.fillText(label, left + (right - left) * fraction, bottom + 6);
      }
      return {left, right};
    }

    function addChart(code, start, end) {
      const series = data.pnl[code];
      const first = Math.max(start, series.start);
      const offset = first - series.start;
      const base = offset ? series.values[offset - 1] : 0;
      const path = [0, ...series.values.slice(offset, end - series.start).map(value => value - base)];
      const times = [dates[first] - 86400000, ...dates.slice(first, end)];
      addSeriesChart(productName(code), path, times, charts, code);
    }

    function portfolioPath(codes, start, end, indices = Array.from({length: end - start}, (_, i) => start + i)) {
      const valueAt = (code, index) => {
        const series = data.pnl[code];
        return index < series.start ? 0 : series.values[index - series.start];
      };
      const bases = codes.map(code => valueAt(code, start - 1));
      return [0, ...indices.map(day =>
        codes.reduce((sum, code, index) => sum + valueAt(code, day) - bases[index], 0)
      )];
    }

    function addSeriesChart(label, path, times, container, code, sessionAxis = false) {
      const figure = document.createElement("figure");
      figure.dataset.product = code;
      const caption = document.createElement("figcaption");
      const name = document.createElement("strong");
      name.textContent = label;
      const readout = document.createElement("output");
      const total = amount.format(path.at(-1)) + " 元";
      readout.textContent = total;
      const range = document.createElement("span");
      range.className = "chart-range";
      range.textContent = new Date(times[0]).toISOString().slice(0, 10) + " 至 " + new Date(times.at(-1)).toISOString().slice(0, 10);
      caption.append(name, readout, range);
      const canvas = document.createElement("canvas");
      canvas.setAttribute("role", "img");
      canvas.setAttribute("aria-label", label + " 累计净盈亏 " + total);
      let area;
      canvas.redraw = () => { area = drawChart(canvas, times, path, sessionAxis); };
      canvas.addEventListener("pointermove", event => {
        if (!area) return;
        const fraction = Math.max(0, Math.min(1, (event.offsetX - area.left) / (area.right - area.left)));
        const target = times[0] + fraction * (times.at(-1) - times[0]);
        const next = times.findIndex(time => time >= target);
        const index = sessionAxis ? Math.round(fraction * (times.length - 1)) : next > 0 && target - times[next - 1] < times[next] - target ? next - 1 : Math.max(0, next);
        readout.textContent = new Date(times[index]).toISOString().slice(0, 10) + "  " + amount.format(path[index]) + " 元";
      });
      canvas.addEventListener("pointerleave", () => { readout.textContent = total; });
      figure.append(caption, canvas);
      container.append(figure);
      observer.observe(canvas);
    }

    function renderPnlBars(rows, selected, start, end) {
      const panel = document.getElementById("pnl-bars");
      panel.replaceChildren();
      panel.hidden = selected.startsWith("product:");
      if (panel.hidden) return;
      if (!rows.length) {
        panel.textContent = "所选范围没有品种净盈亏。";
        return;
      }
      const ranked = [...rows].sort((a, b) => b.net_pnl - a.net_pnl || a.product.localeCompare(b.product));
      const figure = document.createElement("figure");
      const caption = document.createElement("figcaption");
      const title = document.createElement("strong");
      title.textContent = "品种净盈亏排名";
      const range = document.createElement("span");
      range.className = "chart-range";
      range.textContent = data.dates[start] + " 至 " + data.dates[end - 1] + " · 净盈亏从左到右降序 · 盈利红色，亏损绿色 · 单位：元";
      caption.append(title, range);
      const scroll = document.createElement("div");
      scroll.className = "scroll";
      const width = Math.max(680, ranked.length * 30 + 100), height = 340;
      const left = 75, right = width - 15, top = 18, bottom = height - 50;
      const values = ranked.map(row => row.net_pnl);
      const low = Math.min(0, ...values), high = Math.max(0, ...values);
      const padding = Math.max(1, (high - low) * 0.08);
      const y = value => top + (high + padding - value) / (high - low + 2 * padding) * (bottom - top);
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.style.minWidth = width + "px";
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label", "所选范围品种最终净盈亏排名，盈利红色、亏损绿色");
      function element(tag, attrs, text) {
        const item = document.createElementNS("http://www.w3.org/2000/svg", tag);
        for (const [key, value] of Object.entries(attrs)) item.setAttribute(key, value);
        if (text !== undefined) item.textContent = text;
        svg.append(item);
        return item;
      }
      for (let tick = 0; tick <= 4; tick++) {
        const value = low + (high - low) * tick / 4;
        if (high === low && tick > 0) continue;
        element("line", {x1: left, x2: right, y1: y(value), y2: y(value), stroke: "#dce6e7"});
        element("text", {x: left - 8, y: y(value) + 4, "text-anchor": "end", fill: "#4d626c", "font-size": 11}, compact.format(value));
      }
      element("line", {x1: left, x2: right, y1: y(0), y2: y(0), stroke: "#72878d"});
      const step = (right - left) / ranked.length;
      ranked.forEach((row, index) => {
        const center = left + (index + 0.5) * step;
        const bar = element("rect", {x: center - step * 0.34, y: Math.min(y(0), y(row.net_pnl)),
          width: step * 0.68, height: Math.max(1, Math.abs(y(row.net_pnl) - y(0))),
          fill: row.net_pnl > 0 ? "#d63c3c" : row.net_pnl < 0 ? "#008a60" : "#8c9a9d",
          "data-product": row.product, "data-pnl": row.net_pnl});
        const tooltip = document.createElementNS("http://www.w3.org/2000/svg", "title");
        tooltip.textContent = productName(row.product) + "：" + amount.format(row.net_pnl) + " 元";
        bar.append(tooltip);
        element("text", {x: center, y: bottom + 20, "text-anchor": "middle", fill: "#18272f", "font-size": 11}, row.product);
      });
      scroll.append(svg);
      figure.append(caption, scroll);
      panel.append(figure);
    }

    function render() {
      const selected = universe.value;
      const custom = period.value === "Custom";
      document.getElementById("start-year-label").hidden = !custom;
      document.getElementById("end-year-label").hidden = !custom;
      for (const item of startYear.options) item.disabled = Number(item.value) > Number(endYear.value);
      for (const item of endYear.options) item.disabled = Number(item.value) < Number(startYear.value);
      const view = custom ? (startYear.value === endYear.value ? startYear.value : startYear.value + "-" + endYear.value) : period.value;
      const [start, end] = custom ? [yearRanges.get(startYear.value)[0], yearRanges.get(endYear.value)[1]] : yearRanges.get(view) || [0, dates.length];
      const rows = data.product_tables[view].filter(({product}) =>
        selected === "All" || selected === "sector:" + data.products[product].sector || selected === "product:" + product
      );
      const portfolio = data.portfolio_scopes[selected].filter(row => view === "All" ? !String(row.period).includes("-") : String(row.period) === view);
      document.getElementById("selection").textContent =
        data.dates[start] + " 至 " + data.dates[end - 1] + " · " + rows.length + " 个品种";
      renderTable("portfolio", data.portfolio_columns, portfolio);
      renderTable("products", data.product_columns, rows);
      renderPnlBars(rows, selected, start, end);
      observer.disconnect();
      const portfolioChart = document.getElementById("portfolio-chart");
      portfolioChart.replaceChildren();
      const codes = rows.map(row => row.product);
      const scopeLabel = universe.selectedOptions[0].textContent;
      const active = [...new Set(codes.flatMap(code => data.active_dates[code]))]
        .filter(index => index >= start && index < end).sort((a, b) => a - b);
      if (active.length) {
        addSeriesChart(scopeLabel + " · 组合累计净盈亏", portfolioPath(codes, active[0], end, active),
          [dates[active[0]] - 86400000, ...active.map(index => dates[index])], portfolioChart, "portfolio", true);
      } else {
        portfolioChart.textContent = "所选范围没有组合 PnL。";
      }
      charts.replaceChildren();
      charts.dataset.single = String(rows.length === 1);
      for (const {product} of rows) addChart(product, start, end);
      if (!rows.length) charts.textContent = "所选范围没有品种 PnL。";
    }

    addOptions();
    universe.addEventListener("change", render);
    period.addEventListener("change", render);
    startYear.addEventListener("change", render);
    endYear.addEventListener("change", render);
    render();
  </script>
</body>
</html>
