run_id = "mdl_000005"
alpha_id = "mdl_000005"
data_root = "data"
output_root = "data/models"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
cross_section_transform = "rank_gauss"
feature_fill_value = 0.0

[features]
type = "factor_frame"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true

[materialize]
cache_samples = false
cache_dir = "data/model_workspace/mdl_000005/cache"
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = false
write_loss_history = false
write_model_info = true
write_window_summary = true

[model]
name = "pca_ols"
class = "yq_ml_alpha.models.pca_ols_model.PCAOLSAlphaModel"
artifact_dir = "data/model_workspace/mdl_000005/rolling60m_5d_vwap10d/artifacts"

[model.params]
explained_variance = 0.95
