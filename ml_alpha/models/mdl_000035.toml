# HTZQ analyst-coverage GAT, local formal-factor inputs. See docs/ANALYST_COVERAGE_GAT.md.
run_id = "mdl_000035"
alpha_id = "mdl_000035"
data_root = "data"
output_root = "data/models"
data_version = "analyst_coverage_gat_local_factors_v1"

[dates]
train = [20160101, 20260331]
predict = [20210101, 20260424]

[sample]
train_frequency = "5"
predict_frequency = "daily"

[train_scheme]
type = "rolling"
refit_frequency = "quarterly_end"
train_lookback = "60m"
validation_lookback = "3m"
min_train_days = 500

[label]
id = "future_vwap_return_10d"
lookahead_days = 11

[universe]
id = "mkt_all"

[filters]
exclude_limit = false
exclude_st = true
exclude_bj = true

[preprocess]
# History normalization is owned by the sequence provider; labels by the model.
cross_section_transform = "none"
feature_fill_value = 0.0

[features]
type = "analyst_factor_sequence"
root = "data/factors/stock/daily"
columns = "__all__"

[features.params]
include_model_generated = true
sequence_length = 1
history_transform = "mad5_zscore_rank_label"
memory_budget_mb = 512
coverage_root = "data/derived/stock/analyst_coverage"
coverage_window_months = 6

[materialize]
cache_samples = false
predict_batch_size = 20

[diagnostics]
enabled = true
print_epoch = true
write_loss_history = true
write_model_info = true
write_window_summary = true

[model]
name = "analyst_coverage_gat"
class = "yq_ml_alpha.models.analyst_coverage_gat_model.AnalystCoverageGATAlphaModel"
artifact_dir = "data/model_workspace/mdl_000035/rolling60m_5d_vwap10d/artifacts"

[model.params]
sequence_length = 1
hidden_size = 5
negative_slope = 0.2
epochs = 100
patience = 10
lr = 0.0005
weight_decay = 0.0
# Project stock inputs in chunks; every attention query still sees ALL neighbors.
batch_size = 5000
graph_chunk_size = 512
gradient_checkpointing = true
min_delta = 0.000000000001
seed = 42
device = "cuda"
